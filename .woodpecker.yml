# Portable validation on Gitea-connected Woodpecker runners. No publication credentials.
labels:
  platform: linux/amd64
  backend: docker
when:
  - event:
      - push
      - pull_request
      - manual
steps:
  - name: verify
    image: node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
    environment:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      TEST_SHARD_TOTAL: '2'
      VITEST_MAX_WORKERS: '1'
    commands:
      - npm install --global "$(node -p "require('./package.json').packageManager")"
      - pnpm install --frozen-lockfile
      - pnpm run verify
      - python3 -m unittest discover -s tests -p 'test_*development_container.py'
