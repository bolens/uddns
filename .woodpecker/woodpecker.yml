# Portable Linux validation on either forge. Publication is a separate trusted workflow.
labels:
  platform: linux/amd64
  backend: docker
clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
when:
  - event: push
    branch: main
  - event:
      - pull_request
      - manual
      - tag
steps:
  - name: verify
    image: node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
    environment:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      TEST_SHARD_TOTAL: '2'
      VITEST_MAX_WORKERS: '1'
    commands:
      - test "$(git rev-parse --is-shallow-repository)" = false
      - python3 scripts/ci/sync-woodpecker-validation.py --check
      - python3 -m unittest discover -s tests -p test_validation_profile.py
      - python3 -m unittest discover -s tests -p test_ci_node_runtime.py
      - npm install --global "$(node -p "require('./package.json').packageManager")"
      - pnpm install --frozen-lockfile
      - pnpm run verify
      - python3 -m unittest discover -s tests -p 'test_*development_container.py'
      - python3 -m unittest discover -s tests -p test_publication_policy.py
      - python3 -m unittest discover -s tests -p test_image_bridge.py
      - python3 -m unittest discover -s tests -p test_native_pipeline_status.py
  - name: fleet-contracts
    image: node:26-trixie@sha256:6d2c7d5d074bf72f81ddc252b4fbb5d625bc028eeda49cb4b8c2ff8eda1ee617
    environment:
      CI: 'true'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 python3-venv shellcheck
      - bash scripts/ci/check-fleet.sh
  - name: config-and-site
    image: node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853
    environment:
      CI: 'true'
      VP_GIT_HOOKS: '0'
    commands:
      - UDDNS_CONFIG_FILE=examples/uddns.multi.yaml node dist/cli.js check-config
      - UDDNS_CONFIG_FILE=examples/uddns.failover.yaml node dist/cli.js check-config
      - python3 scripts/ci/check-site-accessibility.py
      - python3 scripts/ci/check-site-links.py
  - name: development-environment
    image: nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
    environment:
      CI: 'true'
      UDDNS_CI_NODE_BOOTSTRAP: 'true'
      VP_GIT_HOOKS: '0'
      TEST_SHARD_TOTAL: '2'
      VITEST_MAX_WORKERS: '1'
      NIX_CONFIG: |-
        experimental-features = nix-command flakes
        sandbox = false
        build-users-group =
        max-jobs = 1
        cores = 2
        extra-substituters = https://devenv.cachix.org
        extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - nix run github:cachix/devenv/42246161fa3bf7cd18f8334d08c73d6aaa8762d3 -- test
