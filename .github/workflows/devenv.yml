name: Development environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: devenv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.paths.outputs.environment }}
      devcontainer: ${{ steps.paths.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          filters: |
            devcontainer:
              - ".devcontainer/**"
              - ".github/workflows/devenv.yml"
            environment:
              - 'devenv.*'
              - '.github/workflows/devenv.yml'
              - '**/*.ts'
              - '*.json'
              - '*.yaml'
              - '*.yml'
              - '*.mjs'
              - '.npmrc'
              - '.fallowrc*'
              - '.github/**'
              - '.githooks/**'
              - 'scripts/**'
              - 'tests/**'
              - 'site/**'
              - 'docs/**'
              - '*.md'
              - 'specs/002-development-environments/**'

  validate:
    name: devenv (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.environment == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install github:cachix/devenv/42246161fa3bf7cd18f8334d08c73d6aaa8762d3
      - name: Validate native development environment
        if: runner.os != 'Linux' || vars.WOODPECKER_NIX_CI != 'true'
        run: devenv test

  container:
    name: Docker development environment
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.environment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install github:cachix/devenv/42246161fa3bf7cd18f8334d08c73d6aaa8762d3
      - name: Validate Docker development image
        run: |
          python3 scripts/development-container.py build docker
          python3 scripts/development-container.py run docker -- bash scripts/check-development.sh

  devcontainer:
    name: Devcontainer build and smoke
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build maintained devcontainer Dockerfile
        run: docker build --tag uddns-devcontainer:ci --file .devcontainer/Dockerfile .devcontainer
      - name: Smoke test tools without a Docker socket or network
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --entrypoint bash uddns-devcontainer:ci .devcontainer/smoke.sh

  result:
    name: Development environment
    if: always()
    needs: [changes, validate, container, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected environment checks
        env:
          CHANGES: ${{ needs.changes.result }}
          VALIDATE: ${{ needs.validate.result }}
          CONTAINER: ${{ needs.container.result }}
          DEVCONTAINER: ${{ needs.devcontainer.result }}
          DEVCONTAINER_SELECTED: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.devcontainer == 'true' }}
        run: |
          test "$CHANGES" = success
          case "$VALIDATE" in success|skipped) ;; *) exit 1 ;; esac
          case "$CONTAINER" in success|skipped) ;; *) exit 1 ;; esac
          if [ "$DEVCONTAINER_SELECTED" = true ]; then
            test "$DEVCONTAINER" = success
          else
            case "$DEVCONTAINER" in success|skipped) ;; *) exit 1 ;; esac
          fi
