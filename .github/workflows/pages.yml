name: Pages

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'scripts/ci/check-site-accessibility.py'
      - 'scripts/ci/check-site-links.py'
      - 'scripts/ci/check-site-responsive.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sed -i "s/__LATEST_RELEASE__/$tag/g" site/index.html
          ! grep -R --fixed-strings __LATEST_RELEASE__ site
      - name: Validate site
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/architecture.html
          test -s site/architecture.json
          test -s site/404.html
          test -s site/og.png
          grep -q '<main id="main">' site/index.html
          grep -q 'href="#main"' site/index.html
      - name: Check accessibility and discovery metadata
        run: python3 scripts/ci/check-site-accessibility.py
      - name: Check local links and public metadata
        run: python3 scripts/ci/check-site-links.py
      - name: Check responsive rendering
        run: bash scripts/ci/check-site-responsive.sh
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
