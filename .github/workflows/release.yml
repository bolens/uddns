name: Release

on:
  workflow_dispatch:
    inputs:
      woodpecker_bridge:
        description: Verify and sign the exact native Woodpecker draft
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.WOODPECKER_PUBLISHING != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "
            const tag = process.env.RELEASE_TAG;
            const version = (await import('./package.json', { with: { type: 'json' } })).default.version;
            if (tag !== \`v\${version}\`) {
              console.error(\`Release tag \${tag} must match package.json version v\${version}\`);
              process.exit(1);
            }
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: pnpm run verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Promote verified image aliases
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          minor="${version%.*}"
          docker buildx imagetools create --tag "${IMAGE}:${minor}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: sbom.spdx.json

  woodpecker-oidc:
    name: Sign verified Woodpecker image
    if: vars.WOODPECKER_PUBLISHING == 'true' && github.event_name == 'workflow_dispatch' && inputs.woodpecker_bridge && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: woodpecker-uddns-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      statuses: read
      id-token: write
      packages: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up registry manifest tools
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install registry inspection tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - name: Verify native producer, source, image and offline runtime
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          WOODPECKER_PUBLISHING_ENABLED: ${{ vars.WOODPECKER_PUBLISHING }}
          WOODPECKER_PUBLISHER_ID: ${{ vars.WOODPECKER_PUBLISHER_ID }}
          WOODPECKER_STATUS_CREATOR_ID: ${{ vars.WOODPECKER_STATUS_CREATOR_ID }}
          WOODPECKER_STATUS_PREFIX: ${{ vars.WOODPECKER_STATUS_PREFIX || 'ci/woodpecker' }}
        run: python3 scripts/ci/woodpecker-verify-image.py verify
      - name: Attest actual external builder provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/bolens/uddns
          subject-digest: ${{ steps.native.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: .woodpecker-out/bridge/provenance-predicate.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest native SPDX inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/bolens/uddns
          subject-digest: ${{ steps.native.outputs.digest }}
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: .woodpecker-out/bridge/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign exact native digest with retained public identity
        env:
          DIGEST: ${{ steps.native.outputs.digest }}
        run: cosign sign --yes "ghcr.io/bolens/uddns@$DIGEST"
      - name: Verify signatures, preserve immutable version and promote fresh aliases
        env:
          GH_TOKEN: ${{ github.token }}
          WOODPECKER_PUBLISHING_ENABLED: ${{ vars.WOODPECKER_PUBLISHING }}
          WOODPECKER_PUBLISHER_ID: ${{ vars.WOODPECKER_PUBLISHER_ID }}
        run: python3 scripts/ci/woodpecker-verify-image.py promote

  woodpecker-release-pages:
    name: Refresh Pages after native release
    needs: woodpecker-oidc
    if: vars.WOODPECKER_PUBLISHING == 'true' && github.event_name == 'workflow_dispatch' && inputs.woodpecker_bridge && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: woodpecker-uddns-release-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fresh protected-main Pages after release publication
        env:
          GH_TOKEN: ${{ github.token }}
          WOODPECKER_PUBLISHING_ENABLED: ${{ vars.WOODPECKER_PUBLISHING }}
          WOODPECKER_PUBLISHER_ID: ${{ vars.WOODPECKER_PUBLISHER_ID }}
        run: python3 scripts/ci/woodpecker-verify-image.py render-pages
      - name: Validate release-refreshed site without publication credentials
        run: bash scripts/ci/check-pages.sh --prepared
      - name: Append release-refreshed Pages with fresh source and release guards
        env:
          GH_TOKEN: ${{ github.token }}
          WOODPECKER_PUBLISHING_ENABLED: ${{ vars.WOODPECKER_PUBLISHING }}
          WOODPECKER_PUBLISHER_ID: ${{ vars.WOODPECKER_PUBLISHER_ID }}
        run: python3 scripts/ci/woodpecker-verify-image.py publish-pages
